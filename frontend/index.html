<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="Manage classes, teachers, and students at Sunrise Tuition Centre.">
    <title>Sunrise Tuition Centre | School Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-view="dashboard" aria-label="Sunrise home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span><strong>sunrise</strong><small>tuition centre</small></span>
        </a>
        <div class="nav-label">WORKSPACE</div>
        <nav class="primary-nav">
          <button class="nav-item is-active" data-view="dashboard"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-view="classes"><span class="nav-icon">▦</span>Classes</button>
          <button class="nav-item" data-view="teachers"><span class="nav-icon">♙</span>Teachers</button>
          <button class="nav-item" data-view="students"><span class="nav-icon">♧</span>Students</button>
        </nav>
        <div class="sidebar-note">
          <span class="note-sun" aria-hidden="true">✳</span>
          <strong>A brighter way<br>to learn.</strong>
          <p>Small steps lead to big things.</p>
        </div>
        <div class="sidebar-footer"><span class="online-dot"></span><span id="connection-label">Connecting to school data</span></div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Sunrise Tuition Centre</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="avatar" aria-label="Administrator">SC</span></div>
        </header>
        <section class="page-content">
          <div id="notice-region" aria-live="polite"></div>
          <div id="app-content">
            <div class="loading-block"><span class="spinner"></span><span>Waking up your school workspace…</span></div>
          </div>
        </section>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item is-active" data-view="dashboard"><span>⌂</span>Home</button>
      <button class="mobile-nav-item" data-view="classes"><span>▦</span>Classes</button>
      <button class="mobile-nav-item" data-view="teachers"><span>♙</span>Teachers</button>
      <button class="mobile-nav-item" data-view="students"><span>♧</span>Students</button>
    </nav>
    <dialog id="record-dialog" class="record-dialog" aria-labelledby="dialog-title">
      <form id="record-form" method="dialog">
        <div class="dialog-heading">
          <div><span class="eyebrow" id="dialog-eyebrow">RECORD</span><h2 id="dialog-title">Add record</h2></div>
          <button type="button" class="icon-button" data-close-dialog aria-label="Close dialog">×</button>
        </div>
        <div id="form-fields" class="form-fields"></div>
        <div class="dialog-actions"><button type="button" class="button button-quiet" data-close-dialog>Cancel</button><button class="button button-primary" id="save-button" type="submit">Save record</button></div>
      </form>
    </dialog>
    <dialog id="detail-dialog" class="record-dialog detail-dialog" aria-labelledby="detail-title">
      <div class="dialog-heading">
        <div><span class="eyebrow">CLASS PROFILE</span><h2 id="detail-title">Class details</h2></div>
        <button type="button" class="icon-button" data-close-detail aria-label="Close dialog">×</button>
      </div>
      <div id="detail-content"></div>
    </dialog>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </body>
</html>
