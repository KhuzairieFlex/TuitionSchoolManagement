name: Publish static frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure API URL
        env:
          TUITION_API_URL: ${{ vars.TUITION_API_URL }}
        run: |
          node -e '
            const fs = require("node:fs");
            const apiUrl = (process.env.TUITION_API_URL || "").trim().replace(/\/+$/, "");
            if (!apiUrl.startsWith("https://")) {
              console.error("Set the TUITION_API_URL Actions variable to the HTTPS Render API base URL.");
              process.exit(1);
            }
            const configPath = "frontend/config.js";
            const config = fs.readFileSync(configPath, "utf8");
            if (!config.includes("http://localhost:3000")) {
              console.error("Could not find the local API URL placeholder in frontend/config.js.");
              process.exit(1);
            }
            fs.writeFileSync(configPath, config.replace("http://localhost:3000", apiUrl));
          '
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
