<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API connection check</title>
  </head>
  <body>
    <main>
      <h1>API connection check</h1>
      <p id="result" aria-live="polite">Checking…</p>
    </main>
    <script>
      const apiUrl = "https://YOUR-SERVICE.onrender.com";
      fetch(`${apiUrl}/api/health`)
        .then((response) => {
          if (!response.ok) throw new Error(`API returned ${response.status}`);
          return response.json();
        })
        .then((data) => { document.getElementById("result").textContent = `API status: ${data.status}`; })
        .catch((error) => { document.getElementById("result").textContent = `API check failed: ${error.message}`; });
    </script>
  </body>
</html>
